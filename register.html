<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var theme = localStorage.getItem('campuscare-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);

      var t = localStorage.getItem('token');
      if (t && t !== 'null' && t !== 'undefined' && t.split('.').length === 3) {
        document.documentElement.style.display = 'none';
        window.location.replace('dashboard.html');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CampusCare</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
</head>
<body>

  <!-- Top Glass Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="nav-brand-icon">🏛️</div>
      <div class="nav-brand-title">
        <h2>CampusCare</h2>
        <span>University Facility Portal</span>
      </div>
    </a>

    <!-- Mobile Header Actions (Theme + Hamburger) -->
    <div class="nav-mobile-actions">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtnMobile" title="Switch Theme" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
      <button type="button" class="nav-hamburger-btn" id="navHamburgerBtn" title="Toggle navigation menu" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>

    <!-- Navigation Links -->
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="new-complaint.html">+ New Report</a></li>
      <li class="nav-theme-desktop">
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="Switch Theme" aria-label="Toggle theme">
          <span class="theme-icon">🌙</span>
          <span class="theme-label">Dark</span>
        </button>
      </li>
      <li>
        <span id="navUserBadge" style="display: none;"></span>
      </li>
      <li><a href="login.html" id="logoutBtn" class="btn-nav-action">Sign In</a></li>
    </ul>
  </nav>

  <!-- Auth Glass Container -->
  <main class="main-content">
    <div class="glass-panel" style="max-width: 520px; margin: 2rem auto;">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="form-header-icon" style="margin: 0 auto 1rem auto;">📝</div>
        <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--text-main);">Create Account</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px;">Register for university facility management</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <input 
            type="text" 
            id="regName" 
            class="form-control-glass" 
            placeholder="e.g. Md. Ratul Bhuiyan" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Campus Email</label>
          <input 
            type="email" 
            id="regEmail" 
            class="form-control-glass" 
            placeholder="e.g. student@campus.edu" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <input 
            type="password" 
            id="regPassword" 
            class="form-control-glass" 
            placeholder="At least 6 characters" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="regRole">Role Designation</label>
          <select id="regRole" class="form-control-glass" required>
            <option value="STUDENT" selected>Student / Faculty (Report Maintenance)</option>
            <option value="STAFF">Maintenance Technician (Resolve Tickets)</option>
            <option value="ADMIN">University Admin (Assign & Manage)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPhone">Phone Number (Optional)</label>
          <input 
            type="tel" 
            id="regPhone" 
            class="form-control-glass" 
            placeholder="017XXXXXXXX" 
          />
        </div>

        <button type="submit" class="btn btn-secondary btn-block" style="padding: 13px; font-size: 1rem; margin-top: 0.5rem;">
          Register Account
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="login.html" style="color: var(--secondary); font-weight: 600; text-decoration: none;">Sign in here</a>
      </div>

    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <footer>
    <p>&copy; 2026 University Maintenance & Complaint Management System</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
