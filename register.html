<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CampusCare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="nav-brand">
      <h2>🏛️ CampusCare</h2>
      <span>Portal</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="login.html" class="btn-nav-login">Sign In</a></li>
    </ul>
  </nav>

  <!-- Register Container -->
  <main class="main-content">
    <div class="auth-container" style="max-width: 500px;">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Register as a Student, Staff, or University Admin</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input 
            type="text" 
            id="regName" 
            class="form-control" 
            placeholder="e.g. Md. Ratul Bhuiyan" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="regEmail">Campus Email</label>
          <input 
            type="email" 
            id="regEmail" 
            class="form-control" 
            placeholder="e.g. yourname@campus.edu" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input 
            type="password" 
            id="regPassword" 
            class="form-control" 
            placeholder="At least 6 characters" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="regRole">Account Role</label>
          <select id="regRole" class="form-control" required>
            <option value="STUDENT" selected>Student / Faculty (Report Issues)</option>
            <option value="STAFF">Maintenance Staff (Resolve Issues)</option>
            <option value="ADMIN">University Admin (Assign & Manage)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regPhone">Phone Number (Optional)</label>
          <input 
            type="tel" 
            id="regPhone" 
            class="form-control" 
            placeholder="017XXXXXXXX" 
          />
        </div>

        <button type="submit" class="btn btn-block" style="background-color: var(--secondary-color);">Register Account</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        <p>Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Sign in here</a></p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 University Maintenance & Complaint Management System</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
